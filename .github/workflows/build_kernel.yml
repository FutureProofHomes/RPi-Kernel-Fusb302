name: Build Kernel

on:
  push:
    tags: ['*-trixie-rpi-v8-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin trixie
          tag_commit="$(git rev-parse "$GITHUB_SHA^{}")"
          git merge-base --is-ancestor "$tag_commit" origin/trixie

      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build Trixie kernel packages
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME" make deb
          else
            make deb
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-trixie
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.deb

name: Build Kernel

on:
  push:
    branches: [release/trixie]
    tags: ['*-trixie-rpi-v8-*']
  pull_request:
    branches: [release/trixie]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build Trixie kernel packages
        run: make deb

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-trixie
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.deb
